<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script>
      if (localStorage.getItem("auth") !== "yes") location.href = "login.html";
    </script>

    <div class="admin-wrapper">
      <aside class="sidebar">
        <div class="sidebar-logo">👜 Admin</div>
        <nav class="sidebar-nav">
          <button class="tab-btn active" data-tab="add">
            <span class="tab-icon">＋</span> Додати товар
          </button>
          <button class="tab-btn" data-tab="delete">
            <span class="tab-icon">🗑</span> Видалити товар
          </button>
        </nav>
      </aside>

      <div class="main-area">
        <div class="panel-area">

          <div id="addForm" class="panel-card">
            <div class="panel-header">
              <h2>Додати товар</h2>
              <div class="copy-row">
                <input type="number" id="copyFromId" placeholder="ID для копіювання" />
                <button type="button" id="copyProductBtn" class="btn-secondary">📋 Копіювати товар</button>
              </div>
            </div>

            <form id="addFormEl">
              <div class="form-grid">
                <div class="field-group">
                  <label>Назва</label>
                  <input name="name" required placeholder="Назва сумки" />
                </div>
                <div class="field-group">
                  <label>Колір</label>
                  <input name="color" placeholder="Колір" />
                </div>
                <div class="field-group">
                  <label>Стара ціна</label>
                  <input name="oldPrice" type="number" placeholder="0" />
                </div>
                <div class="field-group">
                  <label>Нова ціна</label>
                  <input name="newPrice" type="number" placeholder="0" />
                </div>
                <div class="field-group">
                  <label>Матеріал</label>
                  <input name="material" placeholder="Натуральна шкіра, екошкіра..." />
                </div>
                <div class="field-group">
                  <label>Розміри сумки</label>
                  <input name="dimensions" placeholder="25×18×10 см" />
                </div>
                <div class="field-group">
                  <label>Рейтинг</label>
                  <input name="rating" type="number" step="0.1" min="0" max="5" placeholder="0.0" />
                </div>
                <div class="field-group">
                  <label>Кількість на складі</label>
                  <input name="inStock" type="number" placeholder="0" />
                </div>
                <div class="field-group">
                  <label>Категорія</label>
                  <select id="addCategorySelect"></select>
                  <input type="text" id="addCategoryNew" placeholder="Нова категорія" style="display:none;margin-top:6px" />
                </div>
                <div class="field-group">
                  <label>Бренд</label>
                  <select id="addBrandSelect"></select>
                  <input type="text" id="addBrandNew" placeholder="Новий бренд" style="display:none;margin-top:6px" />
                </div>
                <div class="field-group">
                  <label>Наявність</label>
                  <select name="available">
                    <option value="true">В наявності</option>
                    <option value="false">Немає в наявності</option>
                  </select>
                </div>
                <div class="field-group">
                  <label>Новинка</label>
                  <select name="isNew">
                    <option value="false">Ні</option>
                    <option value="true">Так</option>
                  </select>
                </div>
              </div>

              <div class="field-group full-width">
                <label>Опис</label>
                <textarea name="description" id="addDescription" placeholder="Опис товару..."></textarea>
                <button type="button" id="addBrBtn" class="btn-tiny">+ &lt;br&gt;</button>
              </div>

              <div class="field-group full-width">
                <label>Фото</label>
                <div class="upload-zone">
                  <input type="file" id="addImageInput" accept="image/*" multiple />
                  <button type="button" id="addImageBtn" class="btn-secondary">📤 Завантажити фото</button>
                </div>
                <div id="addImagesLinks" class="image-preview-row"></div>
              </div>

              <button type="submit" class="btn-primary full-btn">Додати товар</button>
            </form>
          </div>

          <div id="deleteForm" class="panel-card" style="display:none">
            <div class="panel-header"><h2>Видалити товар</h2></div>
            <form id="deleteFormEl">
              <div class="field-group">
                <label>ID товару</label>
                <input name="id" type="number" placeholder="ID" />
              </div>
              <button type="submit" class="btn-danger full-btn">Видалити</button>
            </form>
          </div>

        </div>

        <div class="products-area">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Пошук по ID або назві" />
          </div>
          <div id="productsList" class="products-list"></div>
        </div>
      </div>
    </div>

    <div id="editModal" class="modal">
      <div class="modal-content2">
        <div class="modal-header">
          <h3>Редагування товару</h3>
          <button type="button" id="closeEdit" class="modal-close">✕</button>
        </div>
        <form id="modalEditForm">
          <input type="hidden" name="id" />
          <div class="form-grid">
            <div class="field-group">
              <label>Назва</label>
              <input name="name" placeholder="Назва сумки" />
            </div>
            <div class="field-group">
              <label>Колір</label>
              <input name="color" placeholder="Колір" />
            </div>
            <div class="field-group">
              <label>Стара ціна</label>
              <input name="oldPrice" type="number" placeholder="0" />
            </div>
            <div class="field-group">
              <label>Нова ціна</label>
              <input name="newPrice" type="number" placeholder="0" />
            </div>
            <div class="field-group">
              <label>Матеріал</label>
              <input name="material" placeholder="Натуральна шкіра, екошкіра..." />
            </div>
            <div class="field-group">
              <label>Розміри сумки</label>
              <input name="dimensions" placeholder="25×18×10 см" />
            </div>
            <div class="field-group">
              <label>Рейтинг</label>
              <input name="rating" type="number" step="0.1" min="0" max="5" placeholder="0.0" />
            </div>
            <div class="field-group">
              <label>Кількість на складі</label>
              <input name="inStock" type="number" placeholder="0" />
            </div>
            <div class="field-group">
              <label>Категорія</label>
              <select id="editCategorySelect"></select>
              <input type="text" id="editCategoryNew" placeholder="Нова категорія" style="display:none;margin-top:6px" />
            </div>
            <div class="field-group">
              <label>Бренд</label>
              <select id="editBrandSelect"></select>
              <input type="text" id="editBrandNew" placeholder="Новий бренд" style="display:none;margin-top:6px" />
            </div>
            <div class="field-group">
              <label>Наявність</label>
              <select name="available">
                <option value="true">В наявності</option>
                <option value="false">Немає в наявності</option>
              </select>
            </div>
            <div class="field-group">
              <label>Новинка</label>
              <select name="isNew">
                <option value="false">Ні</option>
                <option value="true">Так</option>
              </select>
            </div>
          </div>
          <div class="field-group full-width">
            <label>Опис</label>
            <textarea name="description" id="editDescription" placeholder="Опис товару..."></textarea>
            <button type="button" id="editBrBtn" class="btn-tiny">+ &lt;br&gt;</button>
          </div>
          <div class="field-group full-width">
            <label>Фото</label>
            <div class="upload-zone">
              <input type="file" id="editImageInput" accept="image/*" multiple />
              <button type="button" id="editImageBtn" class="btn-secondary">📤 Додати фото</button>
            </div>
            <div id="editImagesLinks" class="image-preview-row"></div>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Зберегти</button>
            <button type="button" id="closeEdit2" class="btn-outline">Закрити</button>
          </div>
        </form>
      </div>
    </div>

    <div id="successModal" class="modal">
      <div class="modal-content success-modal">
        <div class="success-icon">✅</div>
        <h3>Успішно!</h3>
        <button id="closeSuccess" class="btn-primary">OK</button>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
